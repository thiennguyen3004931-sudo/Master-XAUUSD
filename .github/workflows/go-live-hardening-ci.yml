name: Go-Live Hardening CI

# hardening/go-live: lint, tests, secret scan and dependency audit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, hardening/go-live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-live-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff (pinned)
        run: python -m pip install "ruff==0.16.9"
      - name: Ruff (go-live guard modules)
        run: >
          ruff check --config ruff.go-live.toml
          scripts/v6_go_live_guard.py scripts/v6_kill_switch.py scripts/v6_healthcheck.py
          scripts/v6_telegram_kill_listener.py scripts/v6_offline_backtest.py scripts/v6_export_mt5_history.py
          scripts/v6_emergency_stop_release.py
          tests/test_v6_go_live_guard.py tests/test_v6_go_live_ops.py
      - name: Byte-compile all V6 runtime Python
        run: python -m compileall -q scripts tests packages/mt5-broker/bridge/mt5_bridge

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: V6 runtime suites (risk, execution, go-live guard, kill switch, backtest)
        run: python -m unittest discover -s tests -p "test_v6_*.py" -v
      - name: Install MT5 bridge deps (MetaTrader5 is Windows-only and skipped)
        run: |
          grep -v '^MetaTrader5' packages/mt5-broker/bridge/requirements.txt > /tmp/bridge-req.txt
          python -m pip install -r /tmp/bridge-req.txt
      - name: MT5 bridge suites (mock broker)
        working-directory: packages/mt5-broker/bridge
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Offline backtest smoke (synthetic data, costs on)
        run: python scripts/v6_offline_backtest.py --synthetic --seed 7 --days 30 --out backtest-smoke.json

  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: V6 server source tests
        run: node --test tests/test_v6_server_source.mjs
      - name: V6 live readiness safety contract
        run: node scripts/test-v6-live-readiness-observer-source.mjs

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o gl.sha "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          echo "$(grep " gitleaks_${V}_linux_x64.tar.gz$" gl.sha | cut -d" " -f1)  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan working tree
        run: ./gitleaks dir . -c .gitleaks.toml --redact --exit-code 1
      - name: Scan commits introduced by this change
        if: github.event_name == 'pull_request'
        run: ./gitleaks git . -c .gitleaks.toml --redact --exit-code 1 --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: In-repo tracked-secret boundary
        run: node scripts/security/check-private-secrets.mjs --tracked

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (bridge requirements, pinned)
        run: |
          python -m pip install "pip-audit==2.10.1"
          grep -v '^MetaTrader5' packages/mt5-broker/bridge/requirements.txt > /tmp/bridge-req.txt
          pip-audit -r /tmp/bridge-req.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
