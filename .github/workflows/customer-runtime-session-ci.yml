name: Customer Runtime Session CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/customer-runtime-session/**"
      - "packages/customer-runtime-gate/**"
      - "packages/customer-grant-registry/**"
      - "packages/customer-product-access/**"
      - "packages/installation-proof/**"
      - "packages/license-service/**"
      - "scripts/test-customer-runtime-session-boundary.mjs"
      - ".github/workflows/customer-runtime-session-ci.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/customer-runtime-session/**"
      - "packages/customer-runtime-gate/**"
      - "packages/customer-grant-registry/**"
      - "packages/customer-product-access/**"
      - "packages/installation-proof/**"
      - "packages/license-service/**"
      - "scripts/test-customer-runtime-session-boundary.mjs"
      - ".github/workflows/customer-runtime-session-ci.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: customer-runtime-session-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  customer-runtime-session:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies with bounded retry
        shell: powershell
        run: |
          $ok = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 4) {
              Write-Warning "pnpm install attempt $attempt failed; retrying"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { throw "PNPM_INSTALL_FAILED_AFTER_RETRIES" }

      - name: Build copy protocol dependency
        run: pnpm --filter @xauusd/copy-protocol build

      - name: Build license service dependency
        run: pnpm --filter @xauusd/license-service build

      - name: Build installation proof dependency
        run: pnpm --filter @xauusd/installation-proof build

      - name: Build customer product access dependency
        run: pnpm --filter @xauusd/customer-product-access build

      - name: Build customer grant registry dependency
        run: pnpm --filter @xauusd/customer-grant-registry build

      - name: Build customer activation dependency
        run: pnpm --filter @xauusd/customer-activation build

      - name: Build customer runtime gate dependency
        run: pnpm --filter @xauusd/customer-runtime-gate build

      - name: Customer runtime session tests
        run: pnpm --filter @xauusd/customer-runtime-session test

      - name: Customer runtime session typecheck
        run: pnpm --filter @xauusd/customer-runtime-session typecheck

      - name: Customer runtime session build
        run: pnpm --filter @xauusd/customer-runtime-session build

      - name: Runtime session boundary contract
        run: node --test scripts/test-customer-runtime-session-boundary.mjs

      - name: Diff hygiene
        run: git diff --check

      - name: Safety summary
        shell: powershell
        run: |
          Write-Host 'CUSTOMER_RUNTIME_SESSION=PASS'
          Write-Host 'CHALLENGE_PURPOSE=RECONNECT'
          Write-Host 'CHALLENGE_TTL_MS=60000'
          Write-Host 'REPLAY_PROTECTION=ONE_TIME'
          Write-Host 'PUBLIC_CONTRACT_MUTATION=NONE'
          Write-Host 'TRADING_LOGIC_MUTATION=NONE'
          Write-Host 'PRODUCTION_MUTATION=NONE'
          Write-Host 'BOT_RUNTIME_MUTATION=NONE'
          Write-Host 'MODE_MUTATION=NONE'
          Write-Host 'ARM_MUTATION=NONE'
          Write-Host 'ORDER_MUTATION=NONE'
          Write-Host 'POSITION_MUTATION=NONE'
          Write-Host 'LIVE_TEST_ORDER=NONE'
          Write-Host 'PERSISTENCE_MUTATION=NONE'
          Write-Host 'CUSTOMER_API_GATEWAY=AUTHENTICATED_HTTPS'
          Write-Host 'NETWORK_MUTATION=CUSTOMER_HTTPS_ONLY'
          Write-Host 'API_ROUTE_MUTATION=CUSTOMER_ONLY'
