name: V6 trade entry and stops - offline safety
on:
  pull_request:
    paths:
      - scripts/xauusd_v6_trade_rules.py
      - scripts/mt5-direct-probe.py
      - scripts/v6_daily_loss_guard.py
      - scripts/xauusd-standalone-server.mjs
      - tests/test_v6_trade_rules.py
      - tests/test_v6_mt5_execution.py
      - tests/test_v6_daily_loss_guard.py
      - scripts/ops/check-v6-actions-runner-readonly.ps1
      - docs/V6-GITHUB-ACTIONS-RUNNER-RECOVERY.md
      - .github/workflows/v6-entry-stops-offline-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v6-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile direct-MT5 module and pure rules (no terminal connection)
        run: python -m py_compile scripts/xauusd_v6_trade_rules.py scripts/v6_daily_loss_guard.py scripts/mt5-direct-probe.py tests/test_v6_trade_rules.py tests/test_v6_mt5_execution.py tests/test_v6_daily_loss_guard.py
      - name: Run offline strategy/SL/trailing tests
        run: python -m unittest discover -s tests -p 'test_v6_*.py' -v
      - name: Check V6 standalone Node server syntax
        run: node --check scripts/xauusd-standalone-server.mjs
      - name: Check source-only Web trade mutation guards
        run: node --test tests/test_v6_server_source.mjs

  v6-windows-hosted:
    name: V6 Windows no-terminal safety
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile V6 Python modules without MetaTrader5 installed
        shell: pwsh
        run: python -m py_compile scripts/xauusd_v6_trade_rules.py scripts/v6_daily_loss_guard.py scripts/mt5-direct-probe.py tests/test_v6_trade_rules.py tests/test_v6_mt5_execution.py tests/test_v6_daily_loss_guard.py
      - name: Test V6 order and trailing contracts against mock broker
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_v6_*.py' -v
      - name: Verify standalone server syntax
        shell: pwsh
        run: node --check scripts/xauusd-standalone-server.mjs
      - name: Verify Web mutation guards without a broker
        shell: pwsh
        run: node --test tests/test_v6_server_source.mjs
      - name: Validate read-only Windows self-hosted runner diagnostic script
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\ops\check-v6-actions-runner-readonly.ps1
