name: Phase7C Post-Web Recovery Acceptance Evidence (READ ONLY)

# One-shot when new workflow file is merged to main. No orders or task changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase7c-post-web-recovery-acceptance-once.yml'

permissions:
  contents: read

concurrency:
  group: phase7c-post-web-recovery-acceptance-once
  cancel-in-progress: false

jobs:
  post-recovery-evidence:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout read-only evidence code (not production)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify no-mutation source contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-phase7c-post-web-recovery-acceptance-source.ps1

      - name: Collect current post-recovery acceptance from Windows and MT5 (GET only)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'phase7c-post-web-recovery-acceptance.json'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ops/accept-phase7c-recovered-web-readonly.ps1 -ExpectedSource '196a8420ff008548773f5d385cf5785a9f84e297' -Samples 3 -ReceiptPath $receipt
          if ($LASTEXITCODE -ne 0) { throw 'READONLY_RECOVERY_VERIFIER_UNAVAILABLE' }
          if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw 'READONLY_RECOVERY_RECEIPT_MISSING' }
          $result = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($result.restartAuthorized -ne $false -or $result.liveTradingAuthorized -ne $false) { throw 'UNSAFE_RECOVERY_AUTHORIZATION' }
          if ($result.pass -ne $true) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('BLOCKED: recovery evidence does not meet acceptance. Reasons: ' + (@($result.blockerCodes) -join ','))
            throw 'POST_RECOVERY_READONLY_ACCEPTANCE_BLOCKED'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'PASS: Web/API LIVE runtime observed RUNNING and READY in PAUSE + DISARMED + XAUUSD flat. This does NOT authorize ARM/AUTO or live orders.'

      - name: Upload sanitized acceptance snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-web-recovery-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/phase7c-post-web-recovery-acceptance.json
          retention-days: 7
          if-no-files-found: warn

      - name: Declare non-trading read-only boundary
        if: always()
        shell: powershell
        run: |
          Write-Host 'PHASE7C_POST_RECOVERY_WORKFLOW_READONLY=TRUE'
          Write-Host 'ARM_MUTATION=NONE'
          Write-Host 'BOT_MODE_MUTATION=NONE'
          Write-Host 'TASK_PROCESS_MUTATION=NONE'
          Write-Host 'MT5_ORDER_MUTATION=NONE'
          Write-Host 'PRODUCTION_SOURCE_MUTATION=NONE'
