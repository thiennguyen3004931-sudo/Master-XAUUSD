            }
          } catch {
            Write-Host 'V6_CANDIDATE_PORTS=UNVERIFIED'
          }
          Write-Host 'V6_LIVE_APPROVAL=NO'

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'thiennguyen3004931-sudo/Master-XAUUSD'
        with:
          name: v6-host-stage-${{ github.sha }}
          path: artifacts/v6-isolated-source-only.zip
          if-no-files-found: error
          retention-days: 7

