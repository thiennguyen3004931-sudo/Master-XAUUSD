name: V6 Self-hosted Windows runner preflight (read-only)
on:
  pull_request:
    paths:
      - .github/workflows/v6-self-hosted-runner-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runner-preflight:
    # Only the repository's own PRs may request local self-hosted diagnostics.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 5
    steps:
      - name: Probe tool paths under the runner service account (no checkout, no broker connection)
        shell: cmd
        run: |
          @echo off
          echo V6_RUNNER_PREFLIGHT_READ_ONLY=TRUE
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo CHECK_POWERSHELL_7_PATH_BEGIN
          where pwsh
          if errorlevel 1 echo POWERSHELL_7_PATH=MISSING
          if exist "C:\Program Files\PowerShell\7\pwsh.exe" (echo POWERSHELL_7_DEFAULT_INSTALL=FOUND) else (echo POWERSHELL_7_DEFAULT_INSTALL=MISSING)
          echo CHECK_WINDOWS_POWERSHELL_PATH_BEGIN
          where powershell.exe
          if errorlevel 1 exit /b 2
          echo CHECK_EFFECTIVE_EXECUTION_POLICY_BEGIN
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Get-ExecutionPolicy -List | Format-Table -AutoSize"
          if errorlevel 1 exit /b 3
          echo V6_RUNNER_PREFLIGHT_COMPLETE=TRUE
