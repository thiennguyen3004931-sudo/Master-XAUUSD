name: Phase7C REVERSAL Runtime Adapter CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/phase7c-canonical-daily-recovery-source-adapter.mjs'
      - 'scripts/phase7c-live-source-adapters.mjs'
      - 'scripts/run-phase7b-demo-controller.ts'
      - 'scripts/test-phase7c-canonical-daily-recovery-executors-contract.mjs'
      - '.github/workflows/phase7c-reversal-runtime-adapter-ci.yml'

permissions:
  contents: read

jobs:
  reversal-runtime-adapter:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: REVERSAL generated LIVE source regression
        shell: powershell
        run: |
          node scripts/test-phase7c-canonical-daily-recovery-executors-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE7C_REVERSAL_RUNTIME_ADAPTER=PASS"
          Write-Host "REVERSAL_CONTEXT_DEFINITION_PRESERVED=PASS"
          Write-Host "PRODUCTION_MUTATION=NONE"
          Write-Host "MODE_MUTATION=NONE"
          Write-Host "ARM_MUTATION=NONE"
          Write-Host "ORDER_MUTATION=NONE"
          Write-Host "POSITION_MUTATION=NONE"
          Write-Host "LIVE_TEST_ORDER=NONE"
