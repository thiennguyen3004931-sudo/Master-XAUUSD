name: Phase7C One-Shot Web Evidence Static CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase7c-one-shot-web-recovery-evidence-readonly.yml'
      - '.github/workflows/phase7c-one-shot-web-evidence-source-ci.yml'
      - 'scripts/ops/snapshot-phase7c-web-task-readonly.ps1'
      - 'scripts/test-phase7c-one-shot-web-evidence-readonly-source.ps1'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Static read-only contract (no production access)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-phase7c-one-shot-web-evidence-readonly-source.ps1

      - name: Confirm no production reads in CI
        shell: powershell
        run: |
          Write-Host 'PHASE7C_ONE_SHOT_WEB_EVIDENCE_CI=SOURCE_ONLY'
          Write-Host 'LIVE_PRODUCTION_READS=NONE'
          Write-Host 'LIVE_PRODUCTION_MUTATION=NONE'
