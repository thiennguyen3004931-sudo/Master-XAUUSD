name: BOT IP Protection P1 Copy Protocol CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/copy-protocol/**"
      - "scripts/test-bot-ip-protection-p1-boundary.mjs"
      - ".github/workflows/bot-ip-protection-p1-copy-protocol-ci.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/copy-protocol/**"
      - "scripts/test-bot-ip-protection-p1-boundary.mjs"
      - ".github/workflows/bot-ip-protection-p1-copy-protocol-ci.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: bot-ip-protection-p1-copy-protocol-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  copy-protocol:
    name: copy-protocol-contract
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Protocol tests
        run: pnpm --filter @xauusd/copy-protocol test
      - name: Protocol typecheck
        run: pnpm --filter @xauusd/copy-protocol typecheck
      - name: Protocol build
        run: pnpm --filter @xauusd/copy-protocol build
      - name: IP boundary contract
        run: node --test scripts/test-bot-ip-protection-p1-boundary.mjs
      - name: Diff hygiene
        run: git diff --check
